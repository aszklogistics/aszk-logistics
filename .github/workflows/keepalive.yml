# Pings the Supabase project twice a week so the FREE plan does not pause it
# after a week of inactivity. Needs two repository secrets (see SETUP-GUIDE.md):
#   SUPABASE_URL       e.g. https://abcdxyz.supabase.co
#   SUPABASE_ANON_KEY  the anon / publishable key
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/site_content?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
          echo "ok"
